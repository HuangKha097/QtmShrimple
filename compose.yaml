services:
  frontend:
    build:
      context: ./client
    env_file:
      - ./client/.env.development
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    ports:
      - "5001:5001"
